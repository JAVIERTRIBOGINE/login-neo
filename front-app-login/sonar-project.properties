# metadata (required)
sonar.projectKey=proteo:app-login-light
sonar.projectName=@proteo/app-login-light
sonar.projectVersion=0.1.1

# description (optional)
sonar.projectDescription=Proteo4 App Login Light

# path to source directories (required)
sonar.sources=src

# path to test source directories (optional)
sonar.tests=.
sonar.test.inclusions=src/**/*.spec.ts

# Encoding of sources files (required)
sonar.sourceEncoding=UTF-8

# Typescript module (optional)
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json