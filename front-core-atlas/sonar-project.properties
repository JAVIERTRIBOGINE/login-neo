# description (optional)
sonar.projectDescription=Proteo4 Frontend Core Atlas Library

# path to source directories (required)
sonar.sources=src

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js
sonar.coverage.exclusions=src/config/packages/**/*

# Encoding of sources files (required)
sonar.sourceEncoding=UTF-8

# Typescript module (optional)
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.build.json
